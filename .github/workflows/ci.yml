name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 安装编译所需 SDK
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          SDKMANAGER=$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager || true)
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "找不到 sdkmanager"; ls -la "$SDK_ROOT" || true; exit 1
          fi
          echo "使用 $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.1" "build-tools;37.0.0"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 单元测试与构建
        run: ./gradlew :orgmode:test :app:assembleDebug --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: orgtd-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
